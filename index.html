<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXT PRICE INTELLIGENCE - ALL STATIONS VIEW & FILTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(22, 22, 28, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --sixt-orange: #FF5F00;
      --sixt-orange-gradient: linear-gradient(135deg, #FF5F00 0%, #FF2E00 100%);
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 95, 0, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 46, 0, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .toast-banner {
      position: fixed;
      top: 20px;
      z-index: 9999;
      background-color: rgba(255, 95, 0, 0.95);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 95, 0, 0.5);
      backdrop-filter: blur(10px);
      max-width: 90%;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .title span {
      color: var(--sixt-orange);
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .section-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #FFF;
    }

    label {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    select {
      background-color: #16161c;
    }

    input:focus, select:focus {
      border-color: var(--sixt-orange);
      box-shadow: 0 0 10px rgba(255, 95, 0, 0.3);
    }

    .btn-primary {
      width: 100%;
      background: var(--sixt-orange-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 95, 0, 0.35);
      transition: transform 0.15s ease;
    }

    .result-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .badge-good {
      font-size: 9px;
      font-weight: 800;
      background: rgba(46, 213, 115, 0.15);
      color: #2ed573;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2ed573;
    }

    .badge-bad {
      font-size: 9px;
      font-weight: 800;
      background: rgba(255, 71, 87, 0.15);
      color: #ff4757;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ff4757;
    }

    .logs-drawer {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }

    .log-item {
      font-size: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-banner">
    <span>🔔</span> <span id="toast-text"></span>
  </div>

  <div class="card">
    
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 20px;">
      <h1 class="title">SIXT <span>PRICE INTELLIGENCE</span></h1>
      <p class="subtitle">Panoramica Prezzi Città & Filtro Stazioni Specifiche</p>
    </div>

    <!-- CONTROLLI E FILTRI -->
    <div class="section-box">
      <div class="section-title">1. Seleziona Città e Categoria</div>

      <!-- Macro Città -->
      <div style="margin-top: 10px;">
        <label>Macro Città</label>
        <select id="select-city" onchange="handleCityChange()">
          <option value="Monaco di Baviera">Monaco di Baviera</option>
          <option value="Würzburg">Würzburg</option>
          <option value="Norimberga">Norimberga</option>
          <option value="Francoforte">Francoforte</option>
          <option value="Milano">Milano</option>
          <option value="Roma">Roma</option>
          <option value="Venezia">Venezia</option>
        </select>
      </div>

      <!-- Filtro Stazione Specifica (Opzionale) -->
      <div style="margin-top: 10px;">
        <label>Filtra Stazione (Opzionale)</label>
        <select id="select-station">
          <!-- Dynamically populated -->
        </select>
      </div>

      <!-- Categoria ACRISS -->
      <div style="margin-top: 10px;">
        <label>Categoria Veicolo / Codice ACRISS</label>
        <select id="select-category">
          <!-- Dynamically populated -->
        </select>
      </div>

      <!-- Date -->
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <div style="flex: 1;">
          <label>Data Inizio</label>
          <input type="date" id="input-start">
        </div>
        <div style="flex: 1;">
          <label>Data Fine</label>
          <input type="date" id="input-end">
        </div>
      </div>

      <button class="btn-primary" style="margin-top: 14px;" onclick="runComparison()">
        MOSTRA PREZZI E COMPARAZIONE
      </button>
    </div>

    <!-- RISULTATI PER TUTTE LE STAZIONI -->
    <div id="section-results" class="section-box" style="margin-top: 16px; border: 1px solid #FF5F00; display: none;">
      <div class="section-title" style="color: #FF5F00; display: flex; justify-content: space-between;">
        <span id="res-category-code">2. Risultati per [CLMR/CLAR]</span>
        <span id="res-city-name" style="color: #FFF;">Monaco di Baviera</span>
      </div>

      <div id="results-list" style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px;">
        <!-- Dynamically injected station cards -->
      </div>
    </div>

    <!-- Controls for Background Cloud Cron Engine -->
    <div style="margin-top: 16px;">
      <button id="btn-cron" class="btn-primary" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 95, 0, 0.4); color: #FF5F00; box-shadow: none;" onclick="runManualCron()">
        ⚡ TEST MOTORE CLOUD CRON (MONACO DI BAVIERA)
      </button>
    </div>

    <div style="text-align: center; margin-top: 8px;">
      <button id="btn-toggle-logs" style="background:none; border:none; color:#8E8E93; font-size:10px; font-weight:700; cursor:pointer;" onclick="toggleLogs()">
        ▼ Mostra Log Cloud Cron
      </button>
    </div>

    <div id="logs-drawer" class="logs-drawer">
      <div style="font-size:10px; font-weight:800; color:#FF5F00; margin-bottom:6px;">LOG ESECUZIONE CLOUD CRON (JITTER 1.5S - 4.0S)</div>
      <div id="logs-content" style="font-size:10px; color:#8E8E93;">
        In attesa di primo ciclo di controllo...
      </div>
    </div>

  </div>

  <script>
    const CITY_STATIONS_MAP = {
      'Monaco di Baviera': [
        { id: 'MUC_AP', name: 'Monaco Aeroporto (MUC)', type: 'Aeroporto', currentPrice: 42, avgPrice: 48 },
        { id: 'MUC_HBF', name: 'Monaco Stazione Centrale (Hauptbahnhof)', type: 'Stazione', currentPrice: 38, avgPrice: 45 },
        { id: 'MUC_CTR', name: 'Monaco Centro / Stachus', type: 'Città', currentPrice: 36, avgPrice: 43 },
        { id: 'MUC_EAST', name: 'Monaco Ostbahnhof', type: 'Stazione', currentPrice: 37, avgPrice: 44 }
      ],
      'Würzburg': [
        { id: 'WUE_HBF', name: 'Würzburg Stazione Centrale', type: 'Stazione', currentPrice: 34, avgPrice: 39 },
        { id: 'WUE_CTR', name: 'Würzburg Nürnberger Str.', type: 'Città', currentPrice: 32, avgPrice: 37 }
      ],
      'Norimberga': [
        { id: 'NUE_AP', name: 'Norimberga Aeroporto (NUE)', type: 'Aeroporto', currentPrice: 39, avgPrice: 42 },
        { id: 'NUE_HBF', name: 'Norimberga Stazione Centrale', type: 'Stazione', currentPrice: 35, avgPrice: 40 }
      ],
      'Francoforte': [
        { id: 'FRA_AP', name: 'Francoforte Aeroporto (FRA)', type: 'Aeroporto', currentPrice: 46, avgPrice: 52 },
        { id: 'FRA_HBF', name: 'Francoforte Stazione Centrale', type: 'Stazione', currentPrice: 41, avgPrice: 47 },
        { id: 'FRA_WEST', name: 'Francoforte Ovest / Camberger Str.', type: 'Città', currentPrice: 39, avgPrice: 45 }
      ],
      'Milano': [
        { id: 'MIL_MXP', name: 'Milano Malpensa (MXP)', type: 'Aeroporto', currentPrice: 35, avgPrice: 41 },
        { id: 'MIL_LIN', name: 'Milano Linate (LIN)', type: 'Aeroporto', currentPrice: 37, avgPrice: 43 },
        { id: 'MIL_BGY', name: 'Milano Bergamo Orio al Serio (BGY)', type: 'Aeroporto', currentPrice: 31, avgPrice: 38 },
        { id: 'MIL_CTR', name: 'Milano Stazione Centrale', type: 'Stazione', currentPrice: 36, avgPrice: 42 }
      ],
      'Roma': [
        { id: 'ROM_FCO', name: 'Roma Fiumicino (FCO)', type: 'Aeroporto', currentPrice: 36, avgPrice: 42 },
        { id: 'ROM_CIA', name: 'Roma Ciampino (CIA)', type: 'Aeroporto', currentPrice: 33, avgPrice: 39 },
        { id: 'ROM_TER', name: 'Roma Stazione Termini', type: 'Stazione', currentPrice: 38, avgPrice: 44 }
      ],
      'Venezia': [
        { id: 'VCE_AP', name: 'Venezia Marco Polo (VCE)', type: 'Aeroporto', currentPrice: 40, avgPrice: 46 },
        { id: 'VCE_PR', name: 'Venezia Piazzale Roma', type: 'Città', currentPrice: 42, avgPrice: 49 },
        { id: 'VCE_ME', name: 'Venezia Mestre Stazione', type: 'Stazione', currentPrice: 36, avgPrice: 41 }
      ]
    };

    const ACRISS_CATEGORIES = [
      { code: 'MCMR', name: 'Berlina - Citroën C1 (Manuale)' },
      { code: 'ECMR', name: 'Berlina - Fiat 500 (Manuale)' },
      { code: 'EDMR', name: 'Berlina - VW Polo (Manuale)' },
      { code: 'CCMR/CCAR', name: 'Berlina Premium - MINI Hatch (Man/Auto)' },
      { code: 'CDMR', name: 'Berlina - Fiat Tipo (Manuale)' },
      { code: 'CLMR/CLAR', name: 'Berlina Premium - VW Golf (Man/Auto)' },
      { code: 'CWMR', name: 'Station Wagon - Fiat Tipo SW (Manuale)' },
      { code: 'IDMR/IDAR', name: 'Berlina Premium - Alfa Romeo Giulietta (Man/Auto)' },
      { code: 'ILMR/ILAR', name: 'Berlina Premium - BMW Serie 1 (Man/Auto)' },
      { code: 'SDMR/SDAR', name: 'Berlina Premium - BMW Serie 2 Active Tourer (Man/Auto)' },
      { code: 'SWAR', name: 'Station Wagon Premium - BMW Serie 2 Grand Tourer (Auto)' },
      { code: 'FDAR', name: 'Berlina Premium - Alfa Romeo Giulia (Auto)' },
      { code: 'FWAR', name: 'Station Wagon Premium - BMW Serie 3 Touring (Auto)' },
      { code: 'PDAR', name: 'Berlina Premium - Audi A5 Sportback (Auto)' },
      { code: 'LDAR', name: 'Berlina Premium - BMW Serie 5 (Auto)' },
      { code: 'LWAR', name: 'Station Wagon Premium - BMW Serie 5 Touring (Auto)' },
      { code: 'XCAR', name: 'Berlina Premium - BMW Serie 6 GT (Auto)' },
      { code: 'XDAR', name: 'Berlina Premium - BMW Serie 7 (Auto)' },
      { code: 'XSAR', name: 'Berlina Premium - BMW Serie 8 (Auto)' },
      { code: 'FSAR', name: 'Coupé Premium - BMW Serie 2 Coupé (Auto)' },
      { code: 'LSAR', name: 'Coupé Premium - BMW Serie 4 Gran Coupé (Auto)' },
      { code: 'CVMR', name: 'Minivan - Fiat Qubo (Manuale)' },
      { code: 'IVAR', name: 'Minivan - VW Touran 7S (Auto)' },
      { code: 'SVAR', name: 'Minivan - Peugeot 5008 (Auto)' },
      { code: 'FVMR/FVAR', name: 'Minivan - Fiat Talento (Man/Auto)' },
      { code: 'CTMR/CTAR', name: 'Cabriolet - Fiat 500C (Man/Auto)' },
      { code: 'STAR', name: 'Cabriolet - BMW Serie 2 Cabrio (Auto)' },
      { code: 'LTAR', name: 'Cabriolet - BMW Serie 4 Cabrio (Auto)' },
      { code: 'PTAR', name: 'Cabriolet - BMW Z4 (Auto)' },
      { code: 'CFMR', name: 'Fuoristrada / SUV - Fiat 500X (Manuale)' },
      { code: 'IFMR/IFAR', name: 'Fuoristrada / SUV - Jeep Renegade (Man/Auto)' },
      { code: 'SFMR/SFAR', name: 'Fuoristrada / SUV - Ford Kuga (Man/Auto)' },
      { code: 'FFAR', name: 'Fuoristrada / SUV - BMW X1 (Auto)' },
      { code: 'PFAR', name: 'Fuoristrada / SUV - Jaguar I-Pace (Auto)' },
      { code: 'XFAR', name: 'Fuoristrada / SUV - BMW X5 (Auto)' }
    ];

    let selectedCity = 'Monaco di Baviera';

    function initUI() {
      const catSelect = document.getElementById('select-category');
      catSelect.innerHTML = ACRISS_CATEGORIES.map(cat => 
        `<option value="${cat.code}">[${cat.code}] ${cat.name}</option>`
      ).join('');

      renderStations();
    }

    function renderStations() {
      const stationsSelect = document.getElementById('select-station');
      const stations = CITY_STATIONS_MAP[selectedCity] || [];
      
      let html = `<option value="ALL">✨ Mostra TUTTE le stazioni di ${selectedCity}</option>`;
      html += stations.map(st => `<option value="${st.id}">📍 ${st.name}</option>`).join('');
      stationsSelect.innerHTML = html;

      document.getElementById('btn-cron').innerText = `⚡ TEST MOTORE CLOUD CRON (${selectedCity.toUpperCase()})`;
    }

    function handleCityChange() {
      selectedCity = document.getElementById('select-city').value;
      renderStations();
    }

    function runComparison() {
      const city = selectedCity;
      const stationFilter = document.getElementById('select-station').value;
      const categoryCode = document.getElementById('select-category').value;

      const allCityStations = CITY_STATIONS_MAP[city] || [];
      const displayedStations = stationFilter === 'ALL'
        ? allCityStations
        : allCityStations.filter(s => s.id === stationFilter);

      document.getElementById('section-results').style.display = 'block';
      document.getElementById('res-category-code').innerText = `2. Risultati per [${categoryCode}]`;
      document.getElementById('res-city-name').innerText = city;

      const listElem = document.getElementById('results-list');
      listElem.innerHTML = displayedStations.map(st => {
        const diffPct = (((st.currentPrice - st.avgPrice) / st.avgPrice) * 100).toFixed(1);
        const isGood = st.currentPrice <= st.avgPrice;
        const badgeClass = isGood ? 'badge-good' : 'badge-bad';
        const badgeText = isGood ? `${diffPct}% SOTTO LA MEDIA` : `+${diffPct}% SOPRA LA MEDIA`;

        return `
          <div class="result-card">
            <div>
              <div style="font-size: 12px; font-weight: 800; color: #FFF">${st.name}</div>
              <div style="font-size: 10px; color: #8E8E93; margin-top: 2px;">
                Prezzo Attuale: <strong style="color: #FF5F00">$${st.currentPrice}/gg</strong> (Media: $${st.avgPrice}/gg)
              </div>
            </div>
            <div class="${badgeClass}">${badgeText}</div>
          </div>
        `;
      }).join('');

      showToast(`Confronto prezzi mostrato per stazioni di ${city}!`);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function toggleLogs() {
      const drawer = document.getElementById('logs-drawer');
      const btn = document.getElementById('btn-toggle-logs');
      const isVisible = drawer.style.display === 'block';

      if (isVisible) {
        drawer.style.display = 'none';
        btn.innerText = '▼ Mostra Log Cloud Cron';
      } else {
        drawer.style.display = 'block';
        btn.innerText = '▲ Nascondi Log Cloud Cron';
      }
    }

    function runManualCron() {
      const btn = document.getElementById('btn-cron');
      btn.innerText = '⏳ Jitter Anti-Pattern (1.5s - 4.0s)...';
      btn.disabled = true;

      const randomJitter = Math.floor(Math.random() * (3500 - 1500 + 1)) + 1500;

      setTimeout(() => {
        const categoryCode = document.getElementById('select-category').value || 'CLMR/CLAR';
        const allCityStations = CITY_STATIONS_MAP[selectedCity] || [];
        const simPrice = Math.floor(Math.random() * (45 - 32 + 1)) + 32;
        const time = new Date().toLocaleTimeString();

        const logsContent = document.getElementById('logs-content');
        const item = document.createElement('div');
        item.className = 'log-item';

        item.innerHTML = `<div style="display:flex; justify-content:space-between; color:#FFF">
          <span>Cron Check Completed</span> <span>${time}</span>
        </div>
        <div style="color:#FF5F00">→ [${categoryCode}] ${allCityStations[0]?.name || selectedCity}: Detected $${simPrice}/gg [Jitter: ${randomJitter}ms]</div>`;

        logsContent.prepend(item);

        showToast(`Ciclo Cron completato per ${selectedCity}! Prezzo rilevato: $${simPrice}/gg`);
        btn.innerText = `⚡ TEST MOTORE CLOUD CRON (${selectedCity.toUpperCase()})`;
        btn.disabled = false;
      }, randomJitter);
    }

    initUI();
  </script>
</body>
</html>
