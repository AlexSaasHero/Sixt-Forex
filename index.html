<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXT WEB TRACKER - Grouped Pickup Stations & ACRISS Codes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(22, 22, 28, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --sixt-orange: #FF5F00;
      --sixt-orange-gradient: linear-gradient(135deg, #FF5F00 0%, #FF2E00 100%);
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 95, 0, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 46, 0, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .toast-banner {
      position: fixed;
      top: 20px;
      z-index: 9999;
      background-color: rgba(255, 95, 0, 0.95);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 95, 0, 0.5);
      backdrop-filter: blur(10px);
      max-width: 90%;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title span {
      color: var(--sixt-orange);
    }

    .subtitle-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .subtitle {
      font-size: 10px;
      color: var(--text-secondary);
    }

    .pulse-dot-orange {
      width: 8px;
      height: 8px;
      background-color: var(--sixt-orange);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px var(--sixt-orange);
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(255, 95, 0, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(255, 95, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 95, 0, 0); }
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tabs-container {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      background: transparent;
      position: relative;
    }

    .tab-btn.active {
      background-color: var(--sixt-orange);
      color: #000000;
      box-shadow: 0 0 12px rgba(255, 95, 0, 0.4);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .field {
      flex: 1;
    }

    label {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    select {
      background-color: #16161c;
    }

    input:focus, select:focus {
      border-color: var(--sixt-orange);
      box-shadow: 0 0 10px rgba(255, 95, 0, 0.3);
    }

    .stats-box {
      background: rgba(255, 95, 0, 0.08);
      border: 1px solid rgba(255, 95, 0, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      margin-top: 6px;
    }

    .stats-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--sixt-orange);
      margin-top: 2px;
    }

    .btn-primary {
      background: var(--sixt-orange-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 95, 0, 0.35);
      margin-top: 8px;
      width: 100%;
      transition: transform 0.15s ease;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 95, 0, 0.4);
      color: var(--sixt-orange);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }

    .logs-drawer {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }

    .log-item {
      font-size: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-banner">
    <span>🔔</span> <span id="toast-text"></span>
  </div>

  <div class="card">
    
    <!-- Header -->
    <div class="header">
      <div>
        <h1 class="title">SIXT <span>WEB TRACKER</span></h1>
        <div class="subtitle-wrapper">
          <span class="pulse-dot-orange"></span>
          <p id="sub-title-text" class="subtitle">Cloud Tracker H24 - Notifiche Email & Codici ACRISS</p>
        </div>
      </div>
      <button id="lang-btn" class="lang-btn" onclick="toggleLang()">🇮🇹 IT</button>
    </div>

    <!-- 4 Slot Tabs -->
    <div class="tabs-container">
      <button id="tab-0" class="tab-btn active" onclick="switchSlot(0)">SLOT 1</button>
      <button id="tab-1" class="tab-btn" onclick="switchSlot(1)">SLOT 2</button>
      <button id="tab-2" class="tab-btn" onclick="switchSlot(2)">SLOT 3</button>
      <button id="tab-3" class="tab-btn" onclick="switchSlot(3)">SLOT 4</button>
    </div>

    <!-- Form -->
    <div class="form-group">
      
      <!-- Stazioni Dropdown con Optgroup -->
      <div>
        <label id="lbl-location">SELEZIONA LUOGO DI RITIRO</label>
        <select id="select-location" onchange="updateSlotData()">
          <option value="">-- Scegli una stazione Sixt --</option>

          <optgroup label="Aeroporti Italia">
            <option value="IT_MXP">Milano Malpensa Aeroporto T1 (MXP)</option>
            <option value="IT_LIN">Milano Linate Aeroporto (LIN)</option>
            <option value="IT_BGY">Bergamo Orio al Serio Aeroporto (BGY)</option>
            <option value="IT_FCO">Roma Fiumicino Aeroporto (FCO)</option>
            <option value="IT_CIA">Roma Ciampino Aeroporto (CIA)</option>
            <option value="IT_VCE">Venezia Marco Polo Aeroporto (VCE)</option>
            <option value="IT_TRS">Trieste Ronchi dei Legionari Aeroporto (TRS)</option>
            <option value="IT_BLQ">Bologna Guglielmo Marconi Aeroporto (BLQ)</option>
            <option value="IT_NAP">Napoli Capodichino Aeroporto (NAP)</option>
            <option value="IT_TRN">Torino Caselle Aeroporto (TRN)</option>
            <option value="IT_PSA">Pisa Galileo Galilei Aeroporto (PSA)</option>
            <option value="IT_FLR">Firenze Peretola Aeroporto (FLR)</option>
            <option value="IT_CTA">Catania Fontanarossa Aeroporto (CTA)</option>
            <option value="IT_PMO">Palermo Falcone Borsellino Aeroporto (PMO)</option>
            <option value="IT_CAG">Cagliari Elmas Aeroporto (CAG)</option>
            <option value="IT_OLB">Olbia Costa Smeralda Aeroporto (OLB)</option>
          </optgroup>

          <optgroup label="Stazioni & Città Italia">
            <option value="IT_MIL_CENTRALE">Milano Stazione Centrale</option>
            <option value="IT_ROM_TERMINI">Roma Stazione Termini</option>
            <option value="IT_VEN_PZLE_ROMA">Venezia Piazzale Roma</option>
            <option value="IT_FLR_CENTRALE">Firenze Stazione Santa Maria Novella</option>
            <option value="IT_NAP_CENTRALE">Napoli Stazione Centrale</option>
            <option value="IT_TOR_PORTA_NUOVA">Torino Stazione Porta Nuova</option>
          </optgroup>

          <optgroup label="Aeroporti Internazionali Principali">
            <option value="DE_MUC">Monaco di Baviera Aeroporto (MUC)</option>
            <option value="DE_FRA">Francoforte sul Meno Aeroporto (FRA)</option>
            <option value="DE_BER">Berlino Brandeburgo Aeroporto (BER)</option>
            <option value="AT_VIE">Vienna Schwechat Aeroporto (VIE)</option>
            <option value="ES_BCN">Barcellona El Prat Aeroporto (BCN)</option>
            <option value="ES_MAD">Madrid Barajas Aeroporto (MAD)</option>
            <option value="FR_CDG">Parigi Charles de Gaulle Aeroporto (CDG)</option>
            <option value="FR_NCE">Nizza Costa Azzurra Aeroporto (NCE)</option>
          </optgroup>
        </select>
      </div>

      <!-- Categorie ACRISS Dropdown -->
      <div>
        <label id="lbl-category">SELEZIONA CATEGORIA / CODICE ACRISS</label>
        <select id="select-category" onchange="updateSlotData()">
          <option value="">-- Scegli la categoria ACRISS --</option>
          <option value="MCMR">[MCMR] Berlina - Citroën C1 (Manuale) - 2P/3D</option>
          <option value="ECMR">[ECMR] Berlina - Fiat 500 (Manuale) - 4P/3D</option>
          <option value="EDMR">[EDMR] Berlina - VW Polo (Manuale) - 5P/5D</option>
          <option value="CCMR/CCAR">[CCMR/CCAR] Berlina Premium - MINI Hatch (Man/Auto) - 4P/3D</option>
          <option value="CDMR">[CDMR] Berlina - Fiat Tipo (Manuale) - 5P/5D</option>
          <option value="CLMR/CLAR">[CLMR/CLAR] Berlina Premium - VW Golf (Man/Auto) - 5P/5D</option>
          <option value="CWMR">[CWMR] Station Wagon - Fiat Tipo SW (Manuale) - 5P/5D</option>
          <option value="IDMR/IDAR">[IDMR/IDAR] Berlina Premium - Alfa Romeo Giulietta (Man/Auto) - 5P/5D</option>
          <option value="ILMR/ILAR">[ILMR/ILAR] Berlina Premium - BMW Serie 1 (Man/Auto) - 5P/5D</option>
          <option value="SDMR/SDAR">[SDMR/SDAR] Berlina Premium - BMW Serie 2 Active Tourer (Man/Auto) - 5P/5D</option>
          <option value="SWAR">[SWAR] Station Wagon Premium - BMW Serie 2 Grand Tourer (Auto) - 5P/5D</option>
          <option value="FDAR">[FDAR] Berlina Premium - Alfa Romeo Giulia (Auto) - 5P/5D</option>
          <option value="FWAR">[FWAR] Station Wagon Premium - BMW Serie 3 Touring (Auto) - 5P/5D</option>
          <option value="PDAR">[PDAR] Berlina Premium - Audi A5 Sportback (Auto) - 5P/5D</option>
          <option value="LDAR">[LDAR] Berlina Premium - BMW Serie 5 (Auto) - 5P/5D</option>
          <option value="LWAR">[LWAR] Station Wagon Premium - BMW Serie 5 Touring (Auto) - 5P/5D</option>
          <option value="XCAR">[XCAR] Berlina Premium - BMW Serie 6 GT (Auto) - 5P/5D</option>
          <option value="XDAR">[XDAR] Berlina Premium - BMW Serie 7 (Auto) - 5P/5D</option>
          <option value="XSAR">[XSAR] Berlina Premium - BMW Serie 8 (Auto) - 5P/5D</option>
          <option value="FSAR">[FSAR] Coupé Premium - BMW Serie 2 Coupé (Auto) - 4P/3D</option>
          <option value="LSAR">[LSAR] Coupé Premium - BMW Serie 4 Gran Coupé (Auto) - 5P/5D</option>
          <option value="CVMR">[CVMR] Minivan - Fiat Qubo (Manuale) - 5P/5D</option>
          <option value="IVAR">[IVAR] Minivan - VW Touran 7S (Auto) - 7P/5D</option>
          <option value="SVAR">[SVAR] Minivan - Peugeot 5008 (Auto) - 7P/5D</option>
          <option value="FVMR/FVAR">[FVMR/FVAR] Minivan - Fiat Talento (Man/Auto) - 9P/5D</option>
          <option value="CTMR/CTAR">[CTMR/CTAR] Cabriolet - Fiat 500C (Man/Auto) - 4P/3D</option>
          <option value="STAR">[STAR] Cabriolet - BMW Serie 2 Cabrio (Auto) - 4P/3D</option>
          <option value="LTAR">[LTAR] Cabriolet - BMW Serie 4 Cabrio (Auto) - 4P/3D</option>
          <option value="PTAR">[PTAR] Cabriolet - BMW Z4 (Auto) - 2P/3D</option>
          <option value="CFMR">[CFMR] Fuoristrada / SUV - Fiat 500X (Manuale) - 5P/5D</option>
          <option value="IFMR/IFAR">[IFMR/IFAR] Fuoristrada / SUV - Jeep Renegade (Man/Auto) - 5P/5D</option>
          <option value="SFMR/SFAR">[SFMR/SFAR] Fuoristrada / SUV - Ford Kuga (Man/Auto) - 5P/5D</option>
          <option value="FFAR">[FFAR] Fuoristrada / SUV - BMW X1 (Auto) - 5P/5D</option>
          <option value="PFAR">[PFAR] Fuoristrada / SUV - Jaguar I-Pace (Auto) - 5P/5D</option>
          <option value="XFAR">[XFAR] Fuoristrada / SUV - BMW X5 (Auto) - 5P/5D</option>
        </select>
      </div>

      <!-- Dates -->
      <div class="form-row">
        <div class="field">
          <label id="lbl-start">DATA INIZIO</label>
          <input type="date" id="input-start" oninput="updateSlotData()">
        </div>
        <div class="field">
          <label id="lbl-end">DATA FINE</label>
          <input type="date" id="input-end" oninput="updateSlotData()">
        </div>
      </div>

      <!-- Flair & Email -->
      <div class="form-row">
        <div class="field" style="flex: 1;">
          <label id="lbl-flair">FLAIR MAX ($)</label>
          <input type="number" id="input-flair" placeholder="es. 70" oninput="updateSlotData()">
        </div>
        <div class="field" style="flex: 1.5;">
          <label id="lbl-email">EMAIL PER NOTIFICHE ALERT</label>
          <input type="email" id="input-email" placeholder="nome@email.com" oninput="updateSlotData()">
        </div>
      </div>

      <!-- Stats Box & SVG Graph -->
      <div class="stats-box">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <div>
            <div id="lbl-last" style="font-size: 9px; color: #8E8E93;">ULTIMO RILEVATO</div>
            <div id="val-last" class="stats-val">$ 71</div>
          </div>
          <div style="text-align: right;">
            <div id="lbl-avg" style="font-size: 9px; color: #8E8E93;">MEDIA STORICA</div>
            <div id="val-avg" class="stats-val">$ 78.20</div>
          </div>
        </div>

        <div id="chart-container" style="margin-top: 6px;">
          <div id="lbl-chart" style="font-size: 8px; color: #8E8E93; margin-bottom: 4px;">Trend Prezzi Categoria ($)</div>
          <svg width="100%" height="40" viewBox="0 0 300 40" style="overflow: visible;">
            <path id="svg-path" d="" fill="none" stroke="#FF5F00" stroke-width="2"/>
            <g id="svg-dots"></g>
          </svg>
        </div>
      </div>

      <button id="btn-save" class="btn-primary" onclick="saveSlot()">SALVA E ATTIVA NOTIFICHE EMAIL</button>
      <button id="btn-cron" class="btn-secondary" onclick="runManualCron()">⚡ ESEGUI TEST CRON (4-5H LOGIC)</button>

      <div style="text-align: center; margin-top: 4px;">
        <button id="btn-toggle-logs" style="background:none; border:none; color:#8E8E93; font-size:10px; font-weight:700; cursor:pointer;" onclick="toggleLogs()">
          ▼ Mostra Log Cloud
        </button>
      </div>

      <div id="logs-drawer" class="logs-drawer">
        <div style="font-size:10px; font-weight:800; color:#FF5F00; margin-bottom:6px;">LOG ESECUZIONE CLOUD CRON</div>
        <div id="logs-content" style="font-size:10px; color:#8E8E93;">
          In attesa di primo ciclo di controllo...
        </div>
      </div>

    </div>

  </div>

  <script>
    let currentLang = 'IT';
    let currentSlotIdx = 0;

    const slots = [
      { id: 'slot_1', location: 'DE_MUC', category: 'LSAR', startDate: '2026-08-10', endDate: '2026-08-17', maxPrice: '85', email: 'utente@email.com', history: [85, 82, 79, 74, 71] },
      { id: 'slot_2', location: 'IT_MXP', category: 'XFAR', startDate: '2026-09-01', endDate: '2026-09-05', maxPrice: '140', email: 'utente@email.com', history: [140, 135, 128, 130, 122] },
      { id: 'slot_3', location: '', category: '', startDate: '', endDate: '', maxPrice: '', email: '', history: [] },
      { id: 'slot_4', location: '', category: '', startDate: '', endDate: '', maxPrice: '', email: '', history: [] }
    ];

    const i18n = {
      IT: {
        subtitle: "Cloud Tracker H24 - Notifiche Email & Codici ACRISS",
        location: "SELEZIONA LUOGO DI RITIRO",
        category: "SELEZIONA CATEGORIA / CODICE ACRISS",
        start: "DATA INIZIO",
        end: "DATA FINE",
        flair: "FLAIR MAX ($)",
        email: "EMAIL PER NOTIFICHE ALERT",
        lastPrice: "ULTIMO RILEVATO",
        avgPrice: "MEDIA STORICA",
        chartTitle: "Trend Prezzi Categoria ($)",
        saveBtn: "SALVA E ATTIVA NOTIFICHE EMAIL",
        cronBtn: "⚡ ESEGUI TEST CRON (4-5H LOGIC)",
        savedAlert: "Slot attivato! Riceverai un'email ogni volta che il prezzo della categoria scende sotto la media.",
        viewLogs: "▼ Mostra Log Cloud",
        hideLogs: "▲ Nascondi Log Cloud"
      },
      EN: {
        subtitle: "24/7 Cloud Tracker - Email Alerts & ACRISS Codes",
        location: "SELECT PICKUP LOCATION",
        category: "SELECT CAR CATEGORY / ACRISS CODE",
        start: "START DATE",
        end: "END DATE",
        flair: "MAX FLAIR ($)",
        email: "EMAIL FOR PRICE ALERTS",
        lastPrice: "LAST DETECTED",
        avgPrice: "AVERAGE PRICE",
        chartTitle: "Category Price Trend ($)",
        saveBtn: "SAVE & ENABLE EMAIL ALERTS",
        cronBtn: "⚡ RUN MANUAL CRON CHECK",
        savedAlert: "Slot activated! You will receive an email whenever the category price drops below average.",
        viewLogs: "▼ View Cloud Logs",
        hideLogs: "▲ Hide Cloud Logs"
      }
    };

    function renderUI() {
      const s = slots[currentSlotIdx];
      const t = i18n[currentLang];

      document.getElementById('sub-title-text').innerText = t.subtitle;
      document.getElementById('lang-btn').innerText = currentLang === 'IT' ? '🇮🇹 IT' : '🇬🇧 EN';

      document.getElementById('lbl-location').innerText = t.location;
      document.getElementById('lbl-category').innerText = t.category;
      document.getElementById('lbl-start').innerText = t.start;
      document.getElementById('lbl-end').innerText = t.end;
      document.getElementById('lbl-flair').innerText = t.flair;
      document.getElementById('lbl-email').innerText = t.email;
      document.getElementById('lbl-last').innerText = t.lastPrice;
      document.getElementById('lbl-avg').innerText = t.avgPrice;
      document.getElementById('lbl-chart').innerText = t.chartTitle;
      document.getElementById('btn-save').innerText = t.saveBtn;
      document.getElementById('btn-cron').innerText = t.cronBtn;

      document.getElementById('select-location').value = s.location || '';
      document.getElementById('select-category').value = s.category || '';
      document.getElementById('input-start').value = s.startDate || '';
      document.getElementById('input-end').value = s.endDate || '';
      document.getElementById('input-flair').value = s.maxPrice || '';
      document.getElementById('input-email').value = s.email || '';

      const history = s.history || [];
      const lastPrice = history.length > 0 ? history[history.length - 1] : null;
      const avgPrice = history.length > 0 ? (history.reduce((a, b) => a + b, 0) / history.length).toFixed(2) : null;

      document.getElementById('val-last').innerText = lastPrice ? `$ ${lastPrice}` : '$ --';
      document.getElementById('val-avg').innerText = avgPrice ? `$ ${avgPrice}` : '$ --';

      renderSvgChart(history);

      for (let i = 0; i < 4; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (i === currentSlotIdx) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      }
    }

    function renderSvgChart(data) {
      const container = document.getElementById('chart-container');
      if (!data || data.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'block';

      const pathElem = document.getElementById('svg-path');
      const dotsElem = document.getElementById('svg-dots');

      const width = 300;
      const height = 40;

      if (data.length === 1) {
        pathElem.setAttribute('d', `M 0 ${height/2} L ${width} ${height/2}`);
        dotsElem.innerHTML = `<circle cx="${width/2}" cy="${height/2}" r="3" fill="#FF5F00" />`;
        return;
      }

      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;

      const pathPoints = data.map((val, idx) => {
        const x = (idx / (data.length - 1)) * width;
        const y = height - ((val - min) / range) * (height - 10) - 5;
        return `${idx === 0 ? 'M' : 'L'} ${x} ${y}`;
      }).join(' ');

      pathElem.setAttribute('d', pathPoints);

      let dotsHtml = '';
      data.forEach((val, idx) => {
        const x = (idx / (data.length - 1)) * width;
        const y = height - ((val - min) / range) * (height - 10) - 5;
        dotsHtml += `<circle cx="${x}" cy="${y}" r="3" fill="#FF5F00" />`;
      });
      dotsElem.innerHTML = dotsHtml;
    }

    function switchSlot(idx) {
      currentSlotIdx = idx;
      renderUI();
    }

    function updateSlotData() {
      const s = slots[currentSlotIdx];
      s.location = document.getElementById('select-location').value;
      s.category = document.getElementById('select-category').value;
      s.startDate = document.getElementById('input-start').value;
      s.endDate = document.getElementById('input-end').value;
      s.maxPrice = document.getElementById('input-flair').value;
      s.email = document.getElementById('input-email').value;
    }

    function saveSlot() {
      showToast(i18n[currentLang].savedAlert);
    }

    function toggleLang() {
      currentLang = currentLang === 'IT' ? 'EN' : 'IT';
      renderUI();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function toggleLogs() {
      const drawer = document.getElementById('logs-drawer');
      const btn = document.getElementById('btn-toggle-logs');
      const isVisible = drawer.style.display === 'block';

      if (isVisible) {
        drawer.style.display = 'none';
        btn.innerText = i18n[currentLang].viewLogs;
      } else {
        drawer.style.display = 'block';
        btn.innerText = i18n[currentLang].hideLogs;
      }
    }

    function runManualCron() {
      const btn = document.getElementById('btn-cron');
      btn.innerText = '⏳ Jitter Anti-Pattern (1.5s - 4.0s)...';
      btn.disabled = true;

      const randomJitter = Math.floor(Math.random() * (3500 - 1500 + 1)) + 1500;

      setTimeout(() => {
        const newPrice = Math.floor(Math.random() * (85 - 42 + 1)) + 42;
        const s = slots[currentSlotIdx];
        s.history = [...(s.history || [80, 75]), newPrice];

        renderUI();

        const logsContent = document.getElementById('logs-content');
        const time = new Date().toLocaleTimeString();
        const item = document.createElement('div');
        item.className = 'log-item';
        
        const avg = (s.history.reduce((a,b)=>a+b,0)/s.history.length).toFixed(2);

        item.innerHTML = `<div style="display:flex; justify-content:space-between; color:#FFF">
          <span>Cron Check Completed</span> <span>${time}</span>
        </div>
        <div style="color:#FF5F00">→ Station [${s.location || 'DE_MUC'}]: Detected $${newPrice} (Avg: $${avg}) [Jitter: ${randomJitter}ms]</div>`;

        logsContent.prepend(item);

        showToast(`Ciclo Cron completato! Prezzo rilevato: $${newPrice}`);
        btn.innerText = i18n[currentLang].cronBtn;
        btn.disabled = false;
      }, randomJitter);
    }

    renderUI();
  </script>
</body>
</html>
