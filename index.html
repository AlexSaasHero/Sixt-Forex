<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXT PRICE INTELLIGENCE - MULTILANGUAGE & CAR-RATING FEEDBACK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: rgba(22, 22, 28, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --sixt-orange: #FF5F00;
      --sixt-orange-gradient: linear-gradient(135deg, #FF5F00 0%, #FF2E00 100%);
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 95, 0, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 46, 0, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .toast-banner {
      position: fixed;
      top: 20px;
      z-index: 9999;
      background-color: rgba(255, 95, 0, 0.95);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 95, 0, 0.5);
      backdrop-filter: blur(10px);
      max-width: 90%;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-box {
      background: rgba(15, 15, 20, 0.95);
      border: 1px solid var(--sixt-orange);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(255, 95, 0, 0.2);
      display: none;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .title span {
      color: var(--sixt-orange);
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .section-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #FFF;
    }

    label {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    select {
      background-color: #16161c;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--sixt-orange);
      box-shadow: 0 0 10px rgba(255, 95, 0, 0.3);
    }

    .btn-primary {
      width: 100%;
      background: var(--sixt-orange-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 95, 0, 0.35);
      transition: transform 0.15s ease;
    }

    .result-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .badge-good {
      font-size: 9px;
      font-weight: 800;
      background: rgba(46, 213, 115, 0.15);
      color: #2ed573;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2ed573;
    }

    .badge-bad {
      font-size: 9px;
      font-weight: 800;
      background: rgba(255, 71, 87, 0.15);
      color: #ff4757;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ff4757;
    }

    .car-star {
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .car-star.unselected {
      filter: grayscale(100%) opacity(0.3);
    }

    .logs-drawer {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }

    .log-item {
      font-size: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-banner">
    <span>🔔</span> <span id="toast-text"></span>
  </div>

  <div class="card">
    
    <!-- Top Navigation Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <button class="icon-btn" onclick="toggleFeedbackModal()" title="Feedback">⋮</button>
      <button id="lang-btn" class="lang-btn" onclick="toggleLang()">🇮🇹 IT</button>
    </div>

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 20px;">
      <h1 class="title">SIXT <span>PRICE INTELLIGENCE</span></h1>
      <p id="lbl-subtitle" class="subtitle">Panoramica Prezzi Città & Filtro Stazioni</p>
    </div>

    <!-- MODALE FEEDBACK -->
    <div id="feedback-modal" class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span id="lbl-feedback-title" style="font-size: 12px; font-weight: 800; color: #FF5F00;">Lascia un Feedback</span>
        <button onclick="toggleFeedbackModal()" style="background: none; border: none; color: #8E8E93; cursor: pointer; font-size: 14px;">✕</button>
      </div>

      <input type="text" id="fb-username" placeholder="Il tuo Username (es. @tuo_handle)">

      <div style="margin-top: 10px;">
        <div id="lbl-rating" style="font-size: 10px; color: #8E8E93; margin-bottom: 4px;">Valutazione dell'esperienza:</div>
        <div style="display: flex; gap: 8px;">
          <span class="car-star" onclick="setCarRating(1)">🚗</span>
          <span class="car-star" onclick="setCarRating(2)">🚗</span>
          <span class="car-star" onclick="setCarRating(3)">🚗</span>
          <span class="car-star" onclick="setCarRating(4)">🚗</span>
          <span class="car-star" onclick="setCarRating(5)">🚗</span>
        </div>
      </div>

      <textarea id="fb-comment" placeholder="Scrivi qui cosa ne pensi o come possiamo migliorare..." style="min-height: 60px; margin-top: 10px; resize: vertical;"></textarea>

      <button id="btn-submit-fb" class="btn-primary" style="margin-top: 10px;" onclick="submitFeedback()">INVIA FEEDBACK</button>
    </div>

    <!-- CONTROLLI E FILTRI -->
    <div class="section-box">
      <div id="lbl-sec1" class="section-title">1. Seleziona Città e Categoria</div>

      <div style="margin-top: 10px;">
        <label id="lbl-macro-city">Macro Città</label>
        <select id="select-city" onchange="handleCityChange()">
          <option value="Monaco di Baviera">Monaco di Baviera</option>
          <option value="Würzburg">Würzburg</option>
          <option value="Norimberga">Norimberga</option>
          <option value="Francoforte">Francoforte</option>
          <option value="Milano">Milano</option>
          <option value="Roma">Roma</option>
          <option value="Venezia">Venezia</option>
        </select>
      </div>

      <div style="margin-top: 10px;">
        <label id="lbl-filter-station">Filtra Stazione (Opzionale)</label>
        <select id="select-station">
          <!-- Dynamically populated -->
        </select>
      </div>

      <div style="margin-top: 10px;">
        <label id="lbl-category">Categoria Veicolo / Codice ACRISS</label>
        <select id="select-category">
          <!-- Dynamically populated -->
        </select>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <div style="flex: 1;">
          <label id="lbl-start-date">Data Inizio</label>
          <input type="date" id="input-start">
        </div>
        <div style="flex: 1;">
          <label id="lbl-end-date">Data Fine</label>
          <input type="date" id="input-end">
        </div>
      </div>

      <button id="btn-search" class="btn-primary" style="margin-top: 14px;" onclick="runComparison()">
        MOSTRA PREZZI E COMPARAZIONE
      </button>
    </div>

    <!-- RISULTATI -->
    <div id="section-results" class="section-box" style="margin-top: 16px; border: 1px solid #FF5F00; display: none;">
      <div class="section-title" style="color: #FF5F00; display: flex; justify-content: space-between;">
        <span id="res-sec2-title">2. Risultati per [CLMR/CLAR]</span>
        <span id="res-city-name" style="color: #FFF;">Monaco di Baviera</span>
      </div>

      <div id="results-list" style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px;">
        <!-- Dynamically injected -->
      </div>
    </div>

    <!-- Controls for Background Cloud Cron Engine -->
    <div style="margin-top: 16px;">
      <button id="btn-cron" class="btn-primary" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 95, 0, 0.4); color: #FF5F00; box-shadow: none;" onclick="runManualCron()">
        ⚡ TEST MOTORE CLOUD CRON (MONACO DI BAVIERA)
      </button>
    </div>

    <div style="text-align: center; margin-top: 8px;">
      <button id="btn-toggle-logs" style="background:none; border:none; color:#8E8E93; font-size:10px; font-weight:700; cursor:pointer;" onclick="toggleLogs()">
        ▼ Mostra Log Cloud Cron
      </button>
    </div>

    <div id="logs-drawer" class="logs-drawer">
      <div id="lbl-cron-title" style="font-size:10px; font-weight:800; color:#FF5F00; margin-bottom:6px;">LOG ESECUZIONE CLOUD CRON (JITTER 1.5S - 4.0S)</div>
      <div id="logs-content" style="font-size:10px; color:#8E8E93;">
        In attesa di primo ciclo di controllo...
      </div>
    </div>

  </div>

  <script>
    let currentLang = 'IT';
    let selectedCity = 'Monaco di Baviera';
    let currentRating = 5;

    const CITY_STATIONS_MAP = {
      'Monaco di Baviera': [
        { id: 'MUC_AP', name: 'Monaco Aeroporto (MUC)', currentPrice: 42, avgPrice: 48 },
        { id: 'MUC_HBF', name: 'Monaco Stazione Centrale', currentPrice: 38, avgPrice: 45 },
        { id: 'MUC_CTR', name: 'Monaco Centro / Stachus', currentPrice: 36, avgPrice: 43 }
      ],
      'Würzburg': [
        { id: 'WUE_HBF', name: 'Würzburg Stazione Centrale', currentPrice: 34, avgPrice: 39 },
        { id: 'WUE_CTR', name: 'Würzburg Nürnberger Str.', currentPrice: 32, avgPrice: 37 }
      ],
      'Norimberga': [
        { id: 'NUE_AP', name: 'Norimberga Aeroporto (NUE)', currentPrice: 39, avgPrice: 42 },
        { id: 'NUE_HBF', name: 'Norimberga Stazione Centrale', currentPrice: 35, avgPrice: 40 }
      ],
      'Francoforte': [
        { id: 'FRA_AP', name: 'Francoforte Aeroporto (FRA)', currentPrice: 46, avgPrice: 52 },
        { id: 'FRA_HBF', name: 'Francoforte Stazione Centrale', currentPrice: 41, avgPrice: 47 }
      ],
      'Milano': [
        { id: 'MIL_MXP', name: 'Milano Malpensa (MXP)', currentPrice: 35, avgPrice: 41 },
        { id: 'MIL_LIN', name: 'Milano Linate (LIN)', currentPrice: 37, avgPrice: 43 },
        { id: 'MIL_CTR', name: 'Milano Stazione Centrale', currentPrice: 36, avgPrice: 42 }
      ],
      'Roma': [
        { id: 'ROM_FCO', name: 'Roma Fiumicino (FCO)', currentPrice: 36, avgPrice: 42 },
        { id: 'ROM_TER', name: 'Roma Stazione Termini', currentPrice: 38, avgPrice: 44 }
      ],
      'Venezia': [
        { id: 'VCE_AP', name: 'Venezia Marco Polo (VCE)', currentPrice: 40, avgPrice: 46 },
        { id: 'VCE_ME', name: 'Venezia Mestre Stazione', currentPrice: 36, avgPrice: 41 }
      ]
    };

    const ACRISS_CATEGORIES = [
      { code: 'ECMR', name: 'Berlina - Fiat 500 (Man)' },
      { code: 'CLMR/CLAR', name: 'Berlina Premium - VW Golf (Man/Auto)' },
      { code: 'FDAR', name: 'Berlina Premium - Alfa Romeo Giulia (Auto)' },
      { code: 'FWAR', name: 'Station Wagon - BMW Serie 3 Touring (Auto)' },
      { code: 'LDAR', name: 'Berlina Premium - BMW Serie 5 (Auto)' },
      { code: 'XFAR', name: 'SUV Premium - BMW X5 (Auto)' }
    ];

    const I18N = {
      IT: {
        subtitle: "Panoramica Prezzi Città & Filtro Stazioni",
        sec1: "1. Seleziona Città e Categoria",
        macroCity: "Macro Città",
        filterStation: "Filtra Stazione (Opzionale)",
        allStations: "✨ Mostra TUTTE le stazioni di",
        category: "Categoria Veicolo / Codice ACRISS",
        startDate: "Data Inizio",
        endDate: "Data Fine",
        btnSearch: "MOSTRA PREZZI E COMPARAZIONE",
        sec2: "2. Risultati per",
        currentPrice: "Prezzo Attuale",
        avgPrice: "Media",
        belowAvg: "SOTTO LA MEDIA",
        aboveAvg: "SOPRA LA MEDIA",
        feedbackTitle: "Lascia un Feedback",
        usernamePlaceholder: "Il tuo Username (es. @tuo_handle)",
        ratingLabel: "Valutazione dell'esperienza:",
        commentPlaceholder: "Scrivi qui cosa ne pensi o come possiamo migliorare...",
        btnSubmitFeedback: "INVIA FEEDBACK",
        feedbackSuccess: "Grazie per la recensione! 🚗🔥"
      },
      EN: {
        subtitle: "City Price Intelligence & Station Filtering",
        sec1: "1. Select City and Category",
        macroCity: "Macro City",
        filterStation: "Filter Station (Optional)",
        allStations: "✨ Show ALL stations in",
        category: "Vehicle Category / ACRISS Code",
        startDate: "Start Date",
        endDate: "End Date",
        btnSearch: "SHOW PRICES & COMPARISON",
        sec2: "2. Results for",
        currentPrice: "Current Price",
        avgPrice: "Avg",
        belowAvg: "BELOW AVERAGE",
        aboveAvg: "ABOVE AVERAGE",
        feedbackTitle: "Leave Feedback",
        usernamePlaceholder: "Your Username (e.g., @your_handle)",
        ratingLabel: "Experience Rating:",
        commentPlaceholder: "Tell us what you think or how we can improve...",
        btnSubmitFeedback: "SUBMIT FEEDBACK",
        feedbackSuccess: "Thank you for your review! 🚗🔥"
      }
    };

    function renderUI() {
      const t = I18N[currentLang];
      document.getElementById('lang-btn').innerText = currentLang === 'IT' ? '🇮🇹 IT' : '🇬🇧 EN';
      document.getElementById('lbl-subtitle').innerText = t.subtitle;
      document.getElementById('lbl-sec1').innerText = t.sec1;
      document.getElementById('lbl-macro-city').innerText = t.macroCity;
      document.getElementById('lbl-filter-station').innerText = t.filterStation;
      document.getElementById('lbl-category').innerText = t.category;
      document.getElementById('lbl-start-date').innerText = t.startDate;
      document.getElementById('lbl-end-date').innerText = t.endDate;
      document.getElementById('btn-search').innerText = t.btnSearch;

      document.getElementById('lbl-feedback-title').innerText = t.feedbackTitle;
      document.getElementById('fb-username').placeholder = t.usernamePlaceholder;
      document.getElementById('lbl-rating').innerText = t.ratingLabel;
      document.getElementById('fb-comment').placeholder = t.commentPlaceholder;
      document.getElementById('btn-submit-fb').innerText = t.btnSubmitFeedback;

      renderStations();
    }

    function initUI() {
      const catSelect = document.getElementById('select-category');
      catSelect.innerHTML = ACRISS_CATEGORIES.map(cat => 
        `<option value="${cat.code}">[${cat.code}] ${cat.name}</option>`
      ).join('');

      renderUI();
      setCarRating(5);
    }

    function renderStations() {
      const t = I18N[currentLang];
      const stationsSelect = document.getElementById('select-station');
      const stations = CITY_STATIONS_MAP[selectedCity] || [];
      
      let html = `<option value="ALL">${t.allStations} ${selectedCity}</option>`;
      html += stations.map(st => `<option value="${st.id}">📍 ${st.name}</option>`).join('');
      stationsSelect.innerHTML = html;

      document.getElementById('btn-cron').innerText = `⚡ TEST MOTORE CLOUD CRON (${selectedCity.toUpperCase()})`;
    }

    function handleCityChange() {
      selectedCity = document.getElementById('select-city').value;
      renderStations();
    }

    function toggleLang() {
      currentLang = currentLang === 'IT' ? 'EN' : 'IT';
      renderUI();
    }

    function toggleFeedbackModal() {
      const modal = document.getElementById('feedback-modal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function setCarRating(val) {
      currentRating = val;
      const stars = document.querySelectorAll('.car-star');
      stars.forEach((star, idx) => {
        if (idx < val) {
          star.classList.remove('unselected');
        } else {
          star.classList.add('unselected');
        }
      });
    }

    function submitFeedback() {
      const t = I18N[currentLang];
      const user = document.getElementById('fb-username').value;
      const comm = document.getElementById('fb-comment').value;

      if (!user || !comm) {
        alert(currentLang === 'IT' ? 'Compila tutti i campi!' : 'Please fill in all fields!');
        return;
      }

      showToast(`${t.feedbackSuccess} (${user} - ${currentRating}/5 🚗)`);
      toggleFeedbackModal();
      document.getElementById('fb-username').value = '';
      document.getElementById('fb-comment').value = '';
      setCarRating(5);
    }

    function runComparison() {
      const t = I18N[currentLang];
      const city = selectedCity;
      const stationFilter = document.getElementById('select-station').value;
      const categoryCode = document.getElementById('select-category').value;

      const allCityStations = CITY_STATIONS_MAP[city] || [];
      const displayedStations = stationFilter === 'ALL'
        ? allCityStations
        : allCityStations.filter(s => s.id === stationFilter);

      document.getElementById('section-results').style.display = 'block';
      document.getElementById('res-sec2-title').innerText = `${t.sec2} [${categoryCode}]`;
      document.getElementById('res-city-name').innerText = city;

      const listElem = document.getElementById('results-list');
      listElem.innerHTML = displayedStations.map(st => {
        const diffPct = (((st.currentPrice - st.avgPrice) / st.avgPrice) * 100).toFixed(1);
        const isGood = st.currentPrice <= st.avgPrice;
        const badgeClass = isGood ? 'badge-good' : 'badge-bad';
        const badgeText = isGood ? `${diffPct}% ${t.belowAvg}` : `+${diffPct}% ${t.aboveAvg}`;

        return `
          <div class="result-card">
            <div>
              <div style="font-size: 12px; font-weight: 800; color: #FFF">${st.name}</div>
              <div style="font-size: 10px; color: #8E8E93; margin-top: 2px;">
                ${t.currentPrice}: <strong style="color: #FF5F00">$${st.currentPrice}/gg</strong> (${t.avgPrice}: $${st.avgPrice}/gg)
              </div>
            </div>
            <div class="${badgeClass}">${badgeText}</div>
          </div>
        `;
      }).join('');

      showToast(`Comparazione caricata per stazioni di ${city}!`);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function toggleLogs() {
      const drawer = document.getElementById('logs-drawer');
      const btn = document.getElementById('btn-toggle-logs');
      const isVisible = drawer.style.display === 'block';

      if (isVisible) {
        drawer.style.display = 'none';
        btn.innerText = '▼ Mostra Log Cloud Cron';
      } else {
        drawer.style.display = 'block';
        btn.innerText = '▲ Nascondi Log Cloud Cron';
      }
    }

    function runManualCron() {
      const btn = document.getElementById('btn-cron');
      btn.innerText = '⏳ Jitter Anti-Pattern (1.5s - 4.0s)...';
      btn.disabled = true;

      const randomJitter = Math.floor(Math.random() * (3500 - 1500 + 1)) + 1500;

      setTimeout(() => {
        const categoryCode = document.getElementById('select-category').value || 'CLMR/CLAR';
        const allCityStations = CITY_STATIONS_MAP[selectedCity] || [];
        const simPrice = Math.floor(Math.random() * (45 - 32 + 1)) + 32;
        const time = new Date().toLocaleTimeString();

        const logsContent = document.getElementById('logs-content');
        const item = document.createElement('div');
        item.className = 'log-item';

        item.innerHTML = `<div style="display:flex; justify-content:space-between; color:#FFF">
          <span>Cron Check Completed</span> <span>${time}</span>
        </div>
        <div style="color:#FF5F00">→ [${categoryCode}] ${allCityStations[0]?.name || selectedCity}: Detected $${simPrice}/gg [Jitter: ${randomJitter}ms]</div>`;

        logsContent.prepend(item);

        showToast(`Ciclo Cron completato per ${selectedCity}! Prezzo rilevato: $${simPrice}/gg`);
        btn.innerText = `⚡ TEST MOTORE CLOUD CRON (${selectedCity.toUpperCase()})`;
        btn.disabled = false;
      }, randomJitter);
    }

    initUI();
  </script>
</body>
</html>
